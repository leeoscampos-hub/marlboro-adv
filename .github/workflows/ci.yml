name: CI - LexFlow

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Build, API and smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas_juridico

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile backend
        run: |
          python -m py_compile server.py field_crypto.py db_crypto.py

      - name: Validate encryption helpers
        env:
          ENCRYPTION_PASSPHRASE: ci-test-passphrase
        run: |
          python ./scripts/validate_encryption_and_field_crypto.py

      - name: Validate Docker Compose config
        run: |
          docker compose config --quiet

      - name: Build and start stack
        run: |
          docker compose up -d --build

      - name: Wait for healthcheck
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8765/api/health | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1

      - name: Smoke test login and endpoints
        run: |
          python - <<'PY'
          import json
          import urllib.request

          base = "http://127.0.0.1:8765"

          def call(method, path, body=None, token=None):
              data = json.dumps(body).encode() if body is not None else None
              headers = {"Content-Type": "application/json"} if body is not None else {}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read().decode()
                  return json.loads(raw) if raw else {}

          health = call("GET", "/api/health")
          assert health["status"] == "ok", health

          login = call("POST", "/api/login", {"email": "admin@lexflow.local", "password": "admin123"})
          token = login["token"]

          for path in ["/api/me", "/api/overview", "/api/mvp-status", "/api/endpoints", "/api/cases", "/api/clients"]:
              data = call("GET", path, token=token)
              assert isinstance(data, dict), path

          print("smoke ok")
          PY

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --tail=200 app

      - name: Teardown
        if: always()
        run: |
          docker compose down -v
