name: Bootstrap Branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-dev:
    name: Create dev from main
    runs-on: ubuntu-latest

    steps:
      - name: Create dev branch if missing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const mainRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/main",
            });

            try {
              await github.rest.git.getRef({ owner, repo, ref: "heads/dev" });
              core.info("Branch dev already exists.");
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner,
                repo,
                ref: "refs/heads/dev",
                sha: mainRef.data.object.sha,
              });
              core.info("Branch dev created from main.");
            }
