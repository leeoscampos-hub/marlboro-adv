services:
  caddy:
    image: caddy:2.10-alpine
    container_name: lexflow_proxy
    restart: unless-stopped
    env_file:
      - path: .env.ec2
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - lexflow

  app:
    build: .
    container_name: lexflow_app
    restart: unless-stopped
    env_file:
      - path: .env.ec2
        required: false
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8765
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexflow}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}@db:5432/${POSTGRES_DB:-lexflow}
    expose:
      - "8765"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lexflow

  db:
    image: postgres:16-alpine
    container_name: lexflow_db
    restart: unless-stopped
    env_file:
      - path: .env.ec2
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lexflow}
      POSTGRES_USER: ${POSTGRES_USER:-lexflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - lexflow

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  lexflow:
    name: lexflow_network
